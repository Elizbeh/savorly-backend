services:
  mysql:
    image: mysql:8
    container_name: savorly-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: savorly_db

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql


  migration:
    build: .
    container_name: savorly-migration

    env_file:
      - docker.env

    depends_on:
      mysql:
        condition: service_healthy

    command: npm run migrate

  backend:
    build: .
    container_name: savorly-api

    ports:
      - "5001:5001"

    env_file:
      - docker.env

    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully


volumes:
  mysql-data: