name: Backend CI/CD

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: savorly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: savorly_test
      JWT_SECRET: testsecret
      CLIENT_URL: http://localhost:5174

      # Dummy credentials used only for CI tests
      EMAIL_USER: test@example.com
      EMAIL_PASS: testpass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot && break
            sleep 3
          done

      - name: Mock email service
        run: |
          mkdir -p services/__mocks__
          echo "module.exports = { sendEmail: async () => true };" > services/__mocks__/emailService.js

      - name: Run database migrations
        run: npm run migrate

      - name: Seed database
        run: npm run seed

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  docker-build:
    name: Build and Publish Docker Image

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

          labels: |
            org.opencontainers.image.title=Savorly Backend
            org.opencontainers.image.description=Node.js backend for the Savorly recipe sharing application
            org.opencontainers.image.source=https://github.com/Elizbeh/savorly-backend

          tags: |
            ghcr.io/elizbeh/savorly-backend:latest
            ghcr.io/elizbeh/savorly-backend:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" \
              --password-stdin

            echo "Pulling image..."
            docker pull ghcr.io/elizbeh/savorly-backend:${{ github.sha }}

            echo "Stopping current container..."
            docker stop savorly-api || true

            echo "Removing current container..."
            docker rm savorly-api || true

            echo "Starting new container..."
            docker run -d \
              --name savorly-api \
              --restart unless-stopped \
              --env-file ~/savorly.env \
              -p 5000:5000 \
              ghcr.io/elizbeh/savorly-backend:${{ github.sha }}

            echo "Checking container..."
            sleep 5
            docker ps --filter "name=savorly-api"

            echo "Testing API..."
            curl --fail http://localhost:5000/

            echo "Deployment successful!"